name: DBus interface test

# dde-daemon 的 DBus 接口测试：用 dbus-testing 对刚构建出的 dde-session-daemon
# 在私有总线上跑接口测试。配置在 tests/dbus/（service.yaml / contract.xml / tests.yaml）。
#
# 与 linuxdeepin/.github 的 reusable workflow 不同，这个 job 需要“构建产物”，
# 因此自成一体（不 call 外部 workflow）。
#
# 容器用 Deepin 官方镜像 linuxdeepin/deepin:crimson(与 dde-appearance 一致):
#  - 版本与本仓开发环境对齐(Go/C 库/运行时),bookworm 里被测进程启动即崩
#    (dde-session-daemon 初始化依赖 Deepin 运行时环境,exit 2)
#  - 镜像自带完整 apt 源,golang-go/libglib2.0-dev 等直接可装
#
# 关键点:
#  - 只构建被测目标 out/bin/dde-session-daemon,不跑 make build
#    (make build 依赖 deepin-policy-ts-convert,容器内不需要全量)
#  - GOFLAGS=-mod=vendor:vendor/ 被 gitignore,构建前先 go mod vendor
#  - 私有总线 + 临时 HOME,不碰系统会话;用例不依赖显示环境
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  dbus-interface:
    runs-on: ubuntu-latest
    container: linuxdeepin/deepin:crimson

    steps:
      - uses: actions/checkout@v4

      - name: 安装构建与测试依赖
        # 清单分三部分:
        # ① 构建链:make/golang-go/pkg-config + cgo 所需 C 库 dev 包
        # ② 测试运行时:python3-dbus/gi/yaml + pip/setuptools/wheel
        #    (dbus-testing 用 --no-deps 从源码装,依赖必须 apt 备齐;
        #     setuptools/wheel 是 --no-build-isolation 构建所必需)
        # ③ 桌面运行时资源:被测进程初始化会读(locale 由镜像自带)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git make golang-go pkg-config \
            gcc g++ libc6-dev \
            libglib2.0-dev libgtk-3-dev libgdk-pixbuf-2.0-dev \
            libpulse-dev libasound2-dev \
            libgudev-1.0-dev libudev-dev libsystemd-dev \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev \
            libxcomposite-dev libxdamage-dev libxfixes-dev \
            libxkbcommon-dev libwayland-dev \
            libpango1.0-dev libcairo2-dev \
            libinput-dev libdbus-1-dev libcap-dev libselinux1-dev \
            python3-pip python3-setuptools python3-wheel python3-yaml \
            python3-dbusmock \
            python3-dbus python3-gi dbus \
            gsettings-desktop-schemas dconf-gsettings-backend \
            deepin-desktop-schemas \
            gdb
          go version

      - name: 构建被测二进制(out/bin/dde-session-daemon)
        env:
          GOFLAGS: -mod=vendor
          GOPATH: ${{ github.workspace }}/gopath
        run: |
          # vendor/ 在 .gitignore 里,checkout 后不存在;先按 go.mod 生成,
          # 再走 -mod=vendor 完全离线构建(缺这步 go build 直接报
          # inconsistent vendoring)
          go mod vendor
          make out/bin/dde-session-daemon
          test -x out/bin/dde-session-daemon
          # GSettings schema 编译缓存:deepin-desktop-schemas 装上后需重编
          # (main.go proxy.SetupProxy() 读 com.deepin.wrap.gnome.system.proxy,
          # 缺 schema 时 GLib-GIO-ERROR 直接 abort)
          glib-compile-schemas /usr/share/glib-2.0/schemas/
          # 被测模块自己的数据文件:timedate 的 GetZoneList 读
          # /usr/share/dde/zoneinfo/zone1970.tab(Makefile install-dde-data
          # 平时装,CI 只构建不装包,这里手工补)
          mkdir -p /usr/share/dde && cp -r misc/zoneinfo /usr/share/dde/

      - name: 安装 dbus-testing
        # dbus-testing 尚未发布到 PyPI，只能从源码仓库装。
        # 待审议：是否 fork 进 linuxdeepin 组织并发布 wheel（见文末说明）。
        env:
          DBUS_TESTING_REPO: https://github.com/MyLeeJiEun/deepin-dbus-testing
        run: |
          git clone --depth 1 "${DBUS_TESTING_REPO}" /tmp/dbus-testing-src
          pip install --break-system-packages --no-build-isolation --no-deps \
            /tmp/dbus-testing-src
          dbus-testing --version

      - name: DBus 接口测试
        run: |
          dbus-testing check tests/dbus --static --strict || true
          dbus-testing run tests/dbus --build-dir out --report artifacts/

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbus-test-report
          path: artifacts/
